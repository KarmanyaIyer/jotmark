<!doctype html>
<html lang="en" data-theme="system" data-accent="yellow" data-font-size="medium" data-note-font="system" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jotmark</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" id="app">
    <header class="site">
      <div class="site-text">
        <h1 class="site-host" id="site-host" title="">Jotmark</h1>
        <p class="site-path muted" id="site-path" title="" hidden></p>
      </div>
      <div class="site-actions">
        <button class="icon-btn" id="btn-all" type="button" title="All notes" aria-label="All notes">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M2.5 4h11M2.5 8h11M2.5 12h7"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-settings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6.6 1.8h2.8l.4 1.9 1.4.8 1.8-.7 1.4 2.4-1.5 1.3v1.6l1.5 1.3-1.4 2.4-1.8-.7-1.4.8-.4 1.9H6.6l-.4-1.9-1.4-.8-1.8.7-1.4-2.4 1.5-1.3V7.5L1.6 6.2 3 3.8l1.8.7 1.4-.8z"/>
            <circle cx="8" cy="8" r="2.1"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="site-view">
      <div class="scope segmented" role="radiogroup" aria-label="Which notes to show">
        <label>
          <input type="radio" name="scope" value="domain" id="scope-domain">
          <span>Domain</span>
          <span class="count" id="count-domain">0</span>
        </label>
        <label>
          <input type="radio" name="scope" value="page" id="scope-page">
          <span>Page</span>
          <span class="count" id="count-page">0</span>
        </label>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="note-input">New note</label>
        <textarea class="field" id="note-input" rows="2" placeholder="Write a note" maxlength="20000"></textarea>
        <div class="composer-row">
          <span class="hint muted" id="hint"></span>
          <button type="submit" class="btn btn-primary" id="btn-add">Add note</button>
        </div>
      </form>

      <section class="notes" id="notes" aria-label="Notes">
        <ul class="note-list" id="note-list"></ul>
        <p class="empty" id="empty" hidden></p>
      </section>
    </div>

    <div id="unsupported-view" class="unsupported" hidden>
      <p class="unsupported-title">No site to attach notes to</p>
      <p class="muted" id="unsupported-reason">Jotmark works on regular web pages (http and https). This tab is a browser page.</p>
      <div class="unsupported-actions">
        <button class="btn btn-sm" type="button" id="btn-all-2">Open all notes</button>
        <button class="btn btn-sm" type="button" id="btn-settings-2">Settings</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
